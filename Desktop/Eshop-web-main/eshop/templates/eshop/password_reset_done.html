{% extends "eshop/base.html" %}
{% block title %}Check Your Email - Eshop{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0" style="border-radius:16px; overflow:hidden;">
                <div style="background:#e07b00; height:6px;"></div>
                <div class="card-body p-5 text-center">
                    <div style="width:80px;height:80px;background:#fff3e0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
                        <i class="bi bi-envelope-open" style="color:#e07b00;font-size:2rem;"></i>
                    </div>
                    <h2 class="fw-bold mb-2" style="color:#e07b00;">Check Your Email</h2>
                    <p class="text-muted mb-3">We've sent a password reset link to your email. Check your inbox and spam folder.</p>
                    <p class="text-muted" style="font-size:0.85rem;">The link expires in <strong>24 hours</strong>.</p>
                    <hr>
                    <a href="{% url 'eshop:login' %}" class="btn fw-bold mt-2"
                       style="background:#e07b00; color:#fff; border-radius:10px; padding:10px 30px;">
                        ← Back to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
