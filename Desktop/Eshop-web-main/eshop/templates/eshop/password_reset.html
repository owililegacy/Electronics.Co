{% extends "eshop/base.html" %}
{% block title %}Reset Password - Eshop{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0" style="border-radius:16px; overflow:hidden;">
                <div style="background:#e07b00; height:6px;"></div>
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div style="width:64px;height:64px;background:#fff3e0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;">
                            <i class="bi bi-lock-fill" style="color:#e07b00;font-size:1.6rem;"></i>
                        </div>
                        <h2 class="fw-bold mb-1" style="color:#e07b00;">Forgot Password?</h2>
                        <p class="text-muted" style="font-size:0.9rem;">Enter your email and we'll send you a reset link.</p>
                    </div>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label fw-bold" style="color:#e07b00;">
                                Email Address <span class="text-danger">*</span>
                            </label>
                            <input type="email" name="email"
                                   class="form-control"
                                   style="border:2px solid #e07b00; border-radius:10px; padding:10px 14px;"
                                   placeholder="Enter your registered email"
                                   required
                                   oninvalid="this.setCustomValidity(this.value ? 'Please enter a valid email' : 'Please enter your email')"
                                   oninput="this.setCustomValidity('')">
                        </div>
                        <button type="submit" class="btn w-100 fw-bold"
                                style="background:#e07b00; color:#fff; border-radius:10px; padding:12px; font-size:1rem;">
                             Send Reset Link
                        </button>
                        <div class="text-center mt-3">
                            <a href="{% url 'eshop:login' %}" style="color:#e07b00; font-size:0.9rem; font-weight:600; text-decoration:none;">
                                ← Back to Sign In
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
